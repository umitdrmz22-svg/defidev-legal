name: Legal and EHS gate quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: EHS entitlement gate syntax
        run: node --check ehs-entitlement-gate.js

      - name: Required EHS product contracts
        run: |
          set -euo pipefail
          for product in \
            ehs_ba_monthly \
            ehs_fluchtplan_monthly \
            ehs_brandschutzordnung_monthly \
            ehs_gefahrstoffkataster_monthly \
            ehs_dokumentmanagement_monthly \
            ehs_unfallmanagement_monthly; do
            grep -Fq "$product" ehs-entitlement-gate.js
          done
          grep -Fq 'organizationId' ehs-entitlement-gate.js
          grep -Fq 'selectedWerk' ehs-entitlement-gate.js
          grep -Fq 'defidevEhsWerkSwitcher' ehs-entitlement-gate.js
          grep -Fq "localStorage.removeItem(WORK_KEY)" ehs-entitlement-gate.js
          grep -Fq "location.reload()" ehs-entitlement-gate.js

      - name: EHS dashboard contract
        run: |
          set -euo pipefail
          test -s ehs-dashboard.html
          grep -Fq '/functions/v1/get-ehs-entitlements' ehs-dashboard.html
          grep -Fq 'ehs_ba_monthly' ehs-dashboard.html
          grep -Fq 'ehs_unfallmanagement_monthly' ehs-dashboard.html
          grep -Fq 'personal' ehs-dashboard.html
          grep -Fq 'corporate' ehs-dashboard.html
          ! grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' ehs-dashboard.html
          ! grep -Eqi 'service[_-]?role' ehs-dashboard.html

      - name: Online dashboard contract
        run: |
          set -euo pipefail
          test -s ehs-online.html
          grep -Fq '/functions/v1/get-ehs-entitlements' ehs-online.html
          grep -Fq 'werkId' ehs-online.html
          grep -Fq 'organizationId' ehs-online.html
          grep -Fq '#ehs_token=' ehs-online.html
          ! grep -Eqi '(ip.?lock|device.?lock|ip.?adresse.*werk)' ehs-online.html

      - name: Company admin portal contract
        run: |
          set -euo pipefail
          test -s ehs-company-admin.html
          grep -Fq '/functions/v1/ehs-company-admin' ehs-company-admin.html
          grep -Fq "action:'claim'" ehs-company-admin.html
          grep -Fq "action:'invite'" ehs-company-admin.html
          grep -Fq "action:'removeMember'" ehs-company-admin.html
          grep -Fq "action:'revokeInvite'" ehs-company-admin.html
          grep -Fq 'Bearbeiter' ehs-company-admin.html
          grep -Fq 'Leser' ehs-company-admin.html
          grep -Fq 'auditEvents' ehs-company-admin.html
          grep -Fq 'Audit-Verlauf' ehs-company-admin.html
          grep -Fq "confirm('Diese Einladung wirklich zurückziehen?')" ehs-company-admin.html

      - name: Vendor provisioning portal contract
        run: |
          set -euo pipefail
          test -s ehs-vendor-admin.html
          grep -Fq '/functions/v1/ehs-vendor-admin' ehs-vendor-admin.html
          grep -Fq "action:'createCompany'" ehs-vendor-admin.html
          grep -Fq "action:'addWerk'" ehs-vendor-admin.html
          grep -Fq "action:'updateWerk'" ehs-vendor-admin.html
          grep -Fq 'ownerEmail' ehs-vendor-admin.html
          grep -Fq '3 Bearbeiter' ehs-vendor-admin.html
          grep -Fq '5 Leser' ehs-vendor-admin.html
          grep -Fq 'ehs-company-admin.html' ehs-vendor-admin.html

      - name: Account deletion contract
        run: |
          set -euo pipefail
          test -s delete-ehs-account.html
          grep -Fq '/functions/v1/delete-my-account' delete-ehs-account.html
          grep -Fq 'signInWithPassword' delete-ehs-account.html
          grep -Fq 'confirmEmail' delete-ehs-account.html
          grep -Fq "signOut({scope:'local'})" delete-ehs-account.html
          grep -Fq 'Unternehmensdaten werden nicht' delete-ehs-account.html
          ! grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' delete-ehs-account.html
          ! grep -Eqi 'service[_-]?role' delete-ehs-account.html

      - name: Security and legal links
        run: |
          set -euo pipefail
          for page in ehs-dashboard.html ehs-online.html ehs-company-admin.html ehs-vendor-admin.html delete-ehs-account.html; do
            grep -Fq 'privacy-ehs.html' "$page"
            grep -Fq 'terms-ehs.html' "$page"
            ! grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' "$page"
            ! grep -Eqi 'service[_-]?role' "$page"
          done
