name: One-time company verified email UX patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-company-verified-email-message.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add friendly verified-email message
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ehs-company-admin.html')
          s=p.read_text()
          old="FORBIDDEN:'Sie haben keine Berechtigung für diese Firmenverwaltung.',INVITE_ALREADY_PENDING:"
          new="FORBIDDEN:'Sie haben keine Berechtigung für diese Firmenverwaltung.',VERIFIED_EMAIL_REQUIRED:'Bitte bestätigen Sie zuerst Ihre E-Mail-Adresse über den Bestätigungs- oder Einladungslink.',INVITE_ALREADY_PENDING:"
          if old not in s:
              raise SystemExit('error-map marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq 'Bitte bestätigen Sie zuerst Ihre E-Mail-Adresse' ehs-company-admin.html
      - name: Commit page and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ehs-company-admin.html
          git rm .github/workflows/patch-company-verified-email-message.yml
          git commit -m 'Explain verified email requirement in company portal'
          git push