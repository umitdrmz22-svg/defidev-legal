<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex,nofollow" />
  <title>E-Mail bestätigt – Familio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f7fb;
    }
    main {
      width: min(100%, 460px);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
      text-align: center;
    }
    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #5b6cff;
      color: #fff;
      font-weight: 900;
      font-size: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 25px; line-height: 1.2; }
    p { margin: 0; color: #667085; line-height: 1.6; }
    .status {
      margin: 22px 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: #eef1ff;
      color: #303fbd;
      font-weight: 700;
    }
    a.button {
      display: inline-block;
      margin-top: 4px;
      padding: 13px 20px;
      border-radius: 12px;
      background: #5b6cff;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
    .hint { margin-top: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">F</div>
    <h1>E-Mail bestätigt</h1>
    <p>Deine E-Mail-Adresse wurde bestätigt.</p>
    <div class="status">Du kannst jetzt zu Familio zurückkehren und dich mit deiner E-Mail-Adresse und deinem Passwort anmelden.</div>
    <a class="button" href="familio://">Familio öffnen</a>
    <p class="hint">Falls sich die App nicht automatisch öffnet, starte Familio einfach über dein App-Symbol.</p>
  </main>
  <script>
    // Supabase may append session details in the URL fragment after confirmation.
    // Familio uses password sign-in after verification, so remove the fragment
    // from browser history as soon as the landing page loads.
    if (window.location.hash) {
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    }
  </script>
</body>
</html>
